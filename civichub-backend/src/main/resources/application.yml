server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: civichub-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:civichub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
        format_sql: true
    show-sql: false

app:
  timezone: Asia/Ho_Chi_Minh
  database:
    auto-sync-audit-log-actions: ${AUTO_SYNC_AUDIT_LOG_ACTIONS:true}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  upload:
    path: ${UPLOAD_PATH:uploads}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_MINIMUM_32_CHARS_SECRET_FOR_LOCAL_DEV_ONLY}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    provider: ${AI_PROVIDER:LOCAL}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:local}
    temperature: ${AI_TEMPERATURE:0.2}
    timeout: ${AI_TIMEOUT:30s}
    max-tokens: ${AI_MAX_TOKENS:1024}
    tasks:
      REPORT_SUMMARY:
        enabled: ${AI_TASK_REPORT_SUMMARY_ENABLED:true}
        template-version: ${AI_TASK_REPORT_SUMMARY_TEMPLATE_VERSION:v1}
      IMAGE_CONTEXT:
        enabled: ${AI_TASK_IMAGE_CONTEXT_ENABLED:true}
        template-version: ${AI_TASK_IMAGE_CONTEXT_TEMPLATE_VERSION:v1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.civichub: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
